<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPIRIT ISLAND HELPER</title>
  <link rel="stylesheet" href="./play.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1 class="main-title">SPIRIT ISLAND HELPER</h1>
    </div>
    <div class="topbar-actions">
      <span id="connectionBadge" class="badge">Łączenie…</span>
      <button id="languageToggle" class="button button-ghost" type="button">EN</button>
    </div>
  </header>

  <main class="page-shell">
    <!-- Wybór gracza -->
    <section id="playerPicker" class="picker-card">
      <h2 data-i18n="play.choosePlayer">Wybierz gracza</h2>
      <div id="playerButtons" class="player-buttons"></div>
    </section>

    <!-- Wybór ducha -->
    <section id="spiritPicker" class="picker-card hidden">
      <h2 data-i18n="play.chooseSpirit">Wybierz ducha</h2>
      <div id="spiritGrid" class="spirit-grid"></div>
      <div class="picker-actions">
        <button id="backToPlayers" class="button button-ghost" type="button" data-i18n="play.changePlayer">Zmień gracza</button>
      </div>
    </section>

    <!-- Główny widok gry -->
    <section id="gameView" class="hidden">
      <div id="messageBox" class="alert alert-error hidden"></div>
      
      <!-- Nagłówek gry: nazwa ducha -->
      <div class="game-header card">
        <h2 id="spiritName">—</h2>
      </div>

      <!-- Karta adwersarza i poziomu -->
      <div id="adversaryCard" class="card adversary-card">
        <div class="card-header">
          <div>
            <p class="eyebrow">ADVERSARY</p>
            <h3 id="adversaryTitle">—</h3>
          </div>
        </div>
        <div id="adversaryBoard" class="adversary-board-container"></div>
      </div>

      <!-- Karta ze statusem wszystkich graczy -->
      <div class="card">
        <div class="card-header">
          <h3>Status Graczy</h3>
        </div>
        <div id="playersStatusList" class="overview-list">
          <!-- Renderowani gracze, ich duchy i status gotowości -->
        </div>
      </div>

      <div class="layout">
        <div class="main-column">
          <!-- Box STRACH -->
          <article class="card">
            <div class="card-header">
              <div>
                <h3>STRACH</h3>
              </div>
              <div class="fear-summary">
                <small id="fearCards">0 kart zdobytych</small>
              </div>
            </div>
            
            <div class="fear-bar-container">
              <div id="fearProgressBar" class="fear-bar-fill" style="width: 0%;"></div>
              <span id="fearProgressText" class="fear-bar-text">0/0</span>
            </div>

            <div id="fearControls" class="fear-controls"></div>
          </article>

          <!-- Box AKTUALNA FAZA -->
          <article class="card phase-card">
            <div class="phase-head">
              <div>
                <p class="eyebrow" data-i18n="play.currentPhase">CURRENT PHASE</p>
                <h3 id="phaseTitle">—</h3>
              </div>
              <span id="readyState" class="ready-badge">—</span>
            </div>
            <div id="phaseSteps" class="phase-steps"></div>
            <div class="phase-actions">
              <button id="readyButton" class="button button-primary button-large" type="button">READY</button>
              <button id="advanceButton" class="button button-secondary hidden" type="button" data-i18n="play.advance">ADVANCE PHASE</button>
            </div>
          </article>

          <!-- Box TRACKER (Żywioły) + Przycisk Reset pod spodem -->
          <article id="elementsCard" class="card">
            <div id="elementsGrid" class="elements-grid"></div>
            <div style="margin-top: 14px; text-align: center;">
              <button id="resetElementsButton" class="button button-ghost" type="button" data-i18n="play.elements.reset">Resetuj żywioły</button>
            </div>
          </article>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./play.js"></script>
</body>
</html>
